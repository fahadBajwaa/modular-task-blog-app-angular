<div [ngClass]="{ featured: post.favorite }" class="post-preview">
  <h2 class="post-title">
    <a [routerLink]="['/posts', post.id]" class="post-title-link" title="View details for {{ post.title }}">
      {{ post.title }}
    </a>
  </h2>
  <p class="post-author">By {{ post.author }}</p>
  <p class="post-summary">{{ post.summary }}</p>
</div>
